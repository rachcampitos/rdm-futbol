<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#040d21" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RDM Fútbol" />
    <title>RDM Fútbol ⚽</title>
  </head>
  <body>
    <svg xmlns="http://www.w3.org/2000/svg" style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="sil" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
          <feColorMatrix type="luminanceToAlpha" result="lum"/>
          <feComponentTransfer in="lum" result="inverted">
            <feFuncA type="linear" slope="-1" intercept="1"/>
          </feComponentTransfer>
          <feFlood flood-color="rgba(255,255,255,0.85)" result="white"/>
          <feComposite in="white" in2="inverted" operator="in"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
