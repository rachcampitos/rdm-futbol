<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e2044"/>
      <stop offset="100%" stop-color="#040d21"/>
    </linearGradient>
    <linearGradient id="goldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe066"/>
      <stop offset="100%" stop-color="#c47f0a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%"  stop-color="#f0c040" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#f0c040" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>

  <!-- Subtle glow -->
  <circle cx="256" cy="224" r="160" fill="url(#glow)"/>

  <!-- Gold ring around ball area -->
  <circle cx="256" cy="224" r="133" fill="none" stroke="url(#goldg)" stroke-width="4" opacity="0.5"/>

  <!-- ⚽ Football emoji -->
  <text x="256" y="326"
    text-anchor="middle"
    font-size="230"
    font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">⚽</text>

  <!-- Gold divider line -->
  <line x1="120" y1="366" x2="392" y2="366" stroke="url(#goldg)" stroke-width="1.5" opacity="0.4"/>

  <!-- RDM text -->
  <text x="256" y="444"
    text-anchor="middle"
    font-family="'Arial Black', Impact, sans-serif"
    font-size="110"
    font-weight="900"
    letter-spacing="4"
    fill="url(#goldg)">RDM</text>

  <!-- FÚTBOL subtext -->
  <text x="256" y="484"
    text-anchor="middle"
    font-family="Arial, sans-serif"
    font-size="34"
    font-weight="700"
    letter-spacing="14"
    fill="#f0c040"
    opacity="0.5">FÚTBOL</text>
</svg>
